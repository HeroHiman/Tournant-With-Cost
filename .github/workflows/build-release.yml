name: Build Release APK

on:
  push:
    tags:
      - 'v*' # Triggers workflow on tag pushes like v1.0.0
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'gradle'

    - name: Make Gradle Executable
      run: chmod +x ./gradlew

    - name: Build Release APK
      run: ./gradlew assembleRelease

    # Run unit tests for all product flavors (demo and full)
    - name: Run unit tests
      run: ./gradlew testDemoDebugUnitTest testFullDebugUnitTest testDemoReleaseUnitTest testFullReleaseUnitTest

    # Code quality checks
    - name: Run lint checks
      run: ./gradlew lint