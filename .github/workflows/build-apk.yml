name: Build APK - Error Fix

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build & Test APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21
        cache: gradle

    - name: Make Gradle Executable
      run: chmod +x ./gradlew

    - name: Build Debug and Release APKs
      run: ./gradlew assembleDebug assembleRelease --stacktrace

    - name: Run unit tests
      run: ./gradlew testDemoDebugUnitTest testFullDebugUnitTest

    - name: Run lint checks
      run: ./gradlew lint || true

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: debug-apk
        path: |
          app/build/outputs/apk/*/debug/*.apk
        retention-days: 7

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: release-apk
        path: |
          app/build/outputs/apk/*/release/*.apk
        retention-days: 7

    - name: Create Release (on tag)
      id: create_release
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        release_name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false

    - name: Upload Release Asset (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: app/build/outputs/apk/full/release/app-full-release-unsigned.apk
        asset_name: app-full-release.apk
        asset_content_type: application/vnd.android.package-archive
