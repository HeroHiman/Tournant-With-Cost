name: Bug Fix

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build & Test Debug APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21
        cache: gradle

    - name: Make Gradle Executable
      run: chmod +x ./gradlew

    - name: Build Debug APKs
      run: ./gradlew assembleDebug --stacktrace

    - name: Run unit tests
      run: ./gradlew testDemoDebugUnitTest testFullDebugUnitTest

    - name: Run lint checks
      run: ./gradlew lint || true

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: debug-apk
        path: |
          app/build/outputs/apk/*/debug/*.apk
        retention-days: 7
