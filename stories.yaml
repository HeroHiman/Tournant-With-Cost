# Tournant Project - BMAD Stories

# Team Structure
team:
  product_manager: John
  technical_architect: Winston
  ux_designer: Sally
  developer: Amelia

# Epic Definition
epics:
  
  # Epic 1: Core Recipe Management
  "1":
    title: "Core Recipe Management"
    goal: "Enable users to create, edit, and manage recipes with full-featured editing and preview capabilities"
    priority: HIGH
    stories:
      "1.1":
        title: "Create New Recipes"
        description: "As a user, I want to create new recipes with title, description, ingredients, instructions, and metadata so that I can add new recipes to my cookbook"
        acceptance_criteria:
          - "User can create a recipe with title, description, and metadata fields"
          - "User can add ingredients to a recipe (with amounts, units, and optional items)"
          - "User can add ingredients to groups for organization"
          - "User can add instructions using Markdown formatting"
          - "User can set recipe metadata (season, category, cuisine, yield, language)"
          - "User can save recipes to local database"
          - "User can preview the created recipe before saving"
        dependencies: []
        tech_stack: [kotlin, android, room, retrofit, compose]
        test_focus: [unit, ui, integration]
        complexity: MEDIUM
        
      "1.2":
        title: "Edit Existing Recipes"
        description: "As a user, I want to edit existing recipes so that I can update and modify my cookbook entries"
        acceptance_criteria:
          - "User can select a recipe and open it in edit mode"
          - "User can modify all recipe fields (title, description, metadata)"
          - "User can add or remove ingredients"
          - "User can modify ingredient details (amount, unit, item)"
          - "User can add or remove ingredient groups"
          - "User can modify instructions"
          - "User can save changes and have them persisted"
          - "User can revert to original recipe state"
        dependencies: ["1.1"]
        tech_stack: [kotlin, android, room, retrofit, compose]
        test_focus: [unit, ui, integration]
        complexity: MEDIUM
        
      "1.3":
        title: "Recipe Preview"
        description: "As a user, I want to see a preview of my recipe so that I can quickly review it before saving"
        acceptance_criteria:
          - "User can switch between edit and preview modes"
          - "Preview shows recipe title, description, and metadata"
          - "Preview displays ingredients in organized groups"
          - "Preview shows instructions with Markdown formatting"
          - "Preview includes yield information and scaling options"
          - "User can navigate between preview sections easily"
        dependencies: ["1.1", "1.2"]
        tech_stack: [kotlin, android, compose, markdown, viewmodel]
        test_focus: [ui, unit]
        complexity: LOW

  # Epic 2: Advanced Recipe Features
  "2":
    title: "Advanced Recipe Features"
    goal: "Provide advanced recipe management features for experienced users"
    priority: MEDIUM
    stories:
      "2.1":
        title: "Ingredient Scaling"
        description: "As a user, I want to scale recipe ingredients so that I can adjust serving sizes"
        acceptance_criteria:
          - "User can input a new yield amount"
          - "System automatically scales all ingredient amounts proportionally"
          - "Scaling preserves units and formatting"
          - "User can scale up or down"
          - "Scaling shows original and scaled amounts side by side"
          - "User can reset to original amounts"
          - "System handles fractional amounts correctly"
          - "Scaling respects ingredient ranges when present"
        dependencies: ["1.1", "1.2"]
        tech_stack: [kotlin, android, viewmodel, state, flow]
        test_focus: [unit, ui, performance]
        complexity: MEDIUM
        
      "2.2":
        title: "Ingredient Linking"
        description: "As a user, I want to link related recipes so that I can create recipe dependencies"
        acceptance_criteria:
          - "User can link a recipe as an ingredient to another recipe"
          - "Linked recipes appear as clickable references in ingredient lists"
          - "When clicked, linked recipes open in full view"
          - "System tracks dependencies between recipes"
          - "User can view all recipes that reference a specific recipe"
          - "Links are persistent across app sessions"
          - "Breaking links is supported"
        dependencies: ["1.1", "1.2"]
        tech_stack: [kotlin, android, room, navigation, viewmodel]
        test_focus: [unit, ui, integration]
        complexity: MEDIUM
        
      "2.3":
        title: "Preparation Logging"
        description: "As a user, I want to log when I've prepared a recipe so that I can track my cooking history"
        acceptance_criteria:
          - "User can log a preparation date for any recipe"
          - "System stores preparation dates locally"
          - "User can view all past preparations for a recipe"
          - "User can remove specific preparation entries"
          - "System can calculate relative time since preparation"
          - "Preparation logs are integrated with recipe lists"
          - "Calendar integration for preparation dates"
        dependencies: ["1.1"]
        tech_stack: [kotlin, android, room, date, calendar]
        test_focus: [unit, ui, integration]
        complexity: MEDIUM

  # Epic 3: Search and Organization
  "3":
    title: "Search and Organization"
    goal: "Enable users to easily find and organize their recipes"
    priority: MEDIUM
    stories:
      "3.1":
        title: "Recipe Search"
        description: "As a user, I want to search for recipes so that I can quickly find specific recipes"
        acceptance_criteria:
          - "User can search recipes by title, keywords, or content"
          - "Search provides autocomplete suggestions as user types"
          - "Search results show relevant recipes with thumbnails"
          - "User can filter results by category, cuisine, or season"
          - "Search preserves filters and query across sessions"
          - "Search results are sortable"
          - "Search supports partial matches"
        dependencies: []
        tech_stack: [kotlin, android, room, search, retrofit]
        test_focus: [unit, ui, integration]
        complexity: MEDIUM
        
      "3.2":
        title: "Category and Cuisine Management"
        description: "As a user, I want to categorize and organize recipes so that I can structure my cookbook"
        acceptance_criteria:
          - "User can create and manage recipe categories"
          - "User can create and manage cuisine tags"
          - "User can filter recipes by category and cuisine"
          - "User can assign multiple categories to a single recipe"
          - "System displays recipes in organized collections"
          - "Categories and cuisines are persistent"
          - "User can rename or delete categories"
        dependencies: []
        tech_stack: [kotlin, android, room, viewmodel, state]
        test_focus: [unit, ui, integration]
        complexity: MEDIUM
        
      "3.3":
        title: "Sorting and Filtering"
        description: "As a user, I want to sort and filter my recipes so that I can view them in the most useful order"
        acceptance_criteria:
          - "User can sort recipes by name, date created, date modified, or last prepared"
          - "User can sort ascending or descending"
          - "User can filter recipes by preparation status (prepared/unprepared)"
          - "User can filter recipes by date range (last prepared)"
          - "User can save favorite filters for quick access"
          - "Filters are applied in combination"
          - "Filter counts are displayed"
        dependencies: ["3.1", "3.2"]
        tech_stack: [kotlin, android, room, viewmodel, state, flow]
        test_focus: [unit, ui, integration]
        complexity: MEDIUM

  # Epic 4: Export and Sharing
  "4":
    title: "Export and Sharing"
    goal: "Enable users to export and share recipes across platforms"
    priority: LOW
    stories:
      "4.1":
        title: "JSON Export"
        description: "As a user, I want to export recipes as JSON files so that I can import them into other applications"
        acceptance_criteria:
          - "User can select one or more recipes to export"
          - "System exports recipes as valid JSON format"
          - "JSON includes all recipe data (ingredients, instructions, metadata)"
          - "User can choose export location"
          - "System shows export progress and completion status"
          - "Exported files are human-readable"
          - "JSON can be re-imported into the system"
        dependencies: []
        tech_stack: [kotlin, android, json, file, storage]
        test_focus: [unit, ui, integration]
        complexity: MEDIUM
        
      "4.2":
        title: "Gourmand XML Export"
        description: "As a user, I want to export recipes in Gourmand XML format so that I can use them with Gourmet Recipe Manager"
        acceptance_criteria:
          - "User can select recipes to export to Gourmand format"
          - "System validates recipes for Gourmand compatibility"
          - "System warns about unsupported features"
          - "Exported XML follows Gourmand schema"
          - "User can export multiple recipes as a single archive"
          - "XML files are properly formatted"
          - "Export preserves all recipe information"
        dependencies: ["4.1"]
        tech_stack: [kotlin, android, xml, parser, validator]
        test_focus: [unit, ui, integration]
        complexity: MEDIUM
        
      "4.3":
        title: "Share Functionality"
        description: "As a user, I want to share recipes via other apps so that I can distribute them easily"
        acceptance_criteria:
          - "User can share individual recipes via Android share intent"
          - "User can share recipe lists/collections"
          - "Shared content includes recipe details and images"
          - "User can choose sharing format (JSON, XML, or text)"
          - "Shared content is properly formatted for external apps"
          - "Sharing respects privacy settings"
          - "Share history is maintained"
        dependencies: ["4.1", "4.2"]
        tech_stack: [kotlin, android, share, intent, retrofit]
        test_focus: [ui, integration]
        complexity: MEDIUM

  # Epic 5: Settings and Preferences
  "5":
    title: "Settings and Preferences"
    goal: "Allow users to customize the application behavior"
    priority: LOW
    stories:
      "5.1":
        title: "Markdown Toggle"
        description: "As a user, I want to toggle Markdown support so that I can choose my preferred editing method"
        acceptance_criteria:
          - "User can enable or disable Markdown for instructions"
          - "System shows proper formatting when Markdown is enabled"
          - "System renders HTML when Markdown is disabled"
          - "User preference is saved between sessions"
          - "Preview mode adapts to Markdown setting"
          - "Help text explains Markdown features"
        dependencies: []
        tech_stack: [kotlin, android, compose, markdown, shared_preferences]
        test_focus: [unit, ui]
        complexity: LOW
        
      "5.2":
        title: "Unit System"
        description: "As a user, I want to choose my preferred unit system so that measurements work in my local format"
        acceptance_criteria:
          - "User can select measurement units (metric, imperial, or both)"
          - "System displays ingredient amounts in selected units"
          - "System converts between units as needed"
          - "User preference is saved locally"
          - "Scaling respects unit preferences"
          - "Recipe imports preserve unit preferences"
        dependencies: []
        tech_stack: [kotlin, android, shared_preferences, units]
        test_focus: [unit, ui]
        complexity: LOW
        
      "5.3":
        title: "Display Preferences"
        description: "As a user, I want to customize the display so that it looks and works the way I want"
        acceptance_criteria:
          - "User can choose theme (light/dark/system)"
          - "User can configure screen timeout behavior"
          - "User can adjust font sizes and scaling"
          - "User can enable or disable haptic feedback"
          - "All preferences are saved and applied consistently"
          - "Preferences sync across devices when available"
        dependencies: ["5.1", "5.2"]
        tech_stack: [kotlin, android, compose, shared_preferences, theme]
        test_focus: [ui, unit]
        complexity: LOW

  # Epic 6: Performance and Reliability
  "6":
    title: "Performance and Reliability"
    goal: "Ensure the application is performant and reliable"
    priority: HIGH
    stories:
      "6.1":
        title: "Offline Support"
        description: "As a user, I want to use the application without internet connectivity so that I can cook anytime"
        acceptance_criteria:
          - "All recipe data is stored locally on the device"
          - "User can create, edit, and export recipes offline"
          - "System syncs with cloud when internet is available"
          - "Application works normally without internet connection"
          - "Offline mode has all features available"
          - "Automatic retry on connectivity restoration"
        dependencies: []
        tech_stack: [kotlin, android, room, network, sync]
        test_focus: [integration, performance]
        complexity: MEDIUM
        
      "6.2":
        title: "Performance Optimization"
        description: "As a user, I want the application to load quickly so that I can access recipes instantly"
        acceptance_criteria:
          - "Recipe loading should be under 1 second for most devices"
          - "Database queries should be optimized"
          - "Images should load efficiently with caching"
          - "UI should be responsive during heavy operations"
          - "System should use appropriate bitmap decoding"
          - "Background tasks should not block UI"
          - "Memory usage should be optimized"
        dependencies: ["6.1"]
        tech_stack: [kotlin, android, performance, caching, bitmap]
        test_focus: [performance, integration]
        complexity: MEDIUM
        
      "6.3":
        title: "Error Handling"
        description: "As a user, I want clear error messages when things go wrong so that I can understand and fix issues"
        acceptance_criteria:
          - "System provides clear error messages for all failure cases"
          - "Errors are user-friendly and actionable"
          - "System logs errors for debugging"
          - "User can recover from errors when possible"
          - "System offers suggestions for common errors"
          - "Error reporting respects user privacy"
          - "System can retry failed operations"
        dependencies: []
        tech_stack: [kotlin, android, error_handling, logging]
        test_focus: [unit, integration]
        complexity: MEDIUM

  # Epic 11: Recipe Metadata & Cost Exclusions
  "11":
    title: "Recipe Metadata & Cost Exclusions"
    goal: "Exclude operational and packaging notes from ingredient costing and parse mass yield for cost per kg"
    priority: HIGH
    stories:
      "11.1":
        title: "Informational Cost Exclusion"
        description: "As a recipe creator, I want informational notes (like packaging instructions) excluded from costing calculations"
        acceptance_criteria:
          - "IngredientEntity supports isInformationalOnly flag"
          - "LiveCostCalculator assigns zero cost and excludes informational rows from unpriced warnings"
          - "Room Migration 13 to 14 persists isInformationalOnly flag"
        dependencies: []
        tech_stack: [kotlin, android, room]
        test_focus: [unit]
        complexity: LOW
      "11.2":
        title: "Title & Tray Size Metadata UI"
        description: "As a recipe creator, I want dedicated title and note fields when an item is marked informational"
        acceptance_criteria:
          - "User can toggle between raw material ingredient and informational note"
          - "Informational items display noteTitle and noteValue fields with a 'जानकारी' badge"
        dependencies: ["11.1"]
        tech_stack: [kotlin, android, viewmodel]
        test_focus: [ui, unit]
        complexity: LOW
      "11.3":
        title: "YieldParser & Cost per kg Metric"
        description: "As a cook, I want the system to parse target mass yields and calculate real-time cost per kilogram"
        acceptance_criteria:
          - "YieldParser extracts kilograms from complex strings like '1 टीपा काजू (10 किलो)' and Devanagari numerals"
          - "Real-time cost per kg calculation dynamically updates in Recipe Viewer header"
        dependencies: ["11.1"]
        tech_stack: [kotlin, android, compose]
        test_focus: [unit]
        complexity: MEDIUM
      "11.4":
        title: "Group-Level Informational Exclusion Zones"
        description: "As a production cook, I want entire groups (like टोटल माल or जानकारी) to be marked informational so child notes are excluded from total output mass and costing"
        acceptance_criteria:
          - "IngredientGroupTitle supports isInformationalGroup flag and cascades isInformationalOnly to child items"
          - "LiveCostCalculator excludes informational group items from active mass kg sum and line costing"
          - "Recipe Editor supports group-level 'Mark as Informational' popup toggle with 'जानकारी' badge"
          - "Recipe Viewer hides [+ Add Cost / Map] chip and prices for items within informational groups"
        dependencies: ["11.1", "11.2"]
        tech_stack: [kotlin, android, compose, room]
        test_focus: [ui, unit]
        complexity: MEDIUM

  # Epic 12: Modern Recipe UI & Output Dashboard
  "12":
    title: "Modern Recipe UI & Output Dashboard"
    goal: "Modernize recipe presentation with a financial output dashboard, compact ingredient rows, and fix layout gaps"
    priority: HIGH
    stories:
      "12.1":
        title: "Fix Layout Spacing Bug"
        description: "As a user, I want the recipe detail view to snap directly below the header without large vertical gaps"
        acceptance_criteria:
          - "Remove FlexboxLayout stretch wrapping ComposeView"
          - "Ensure ingredients card snaps directly below header details card"
        dependencies: []
        tech_stack: [android, xml]
        test_focus: [ui]
        complexity: LOW
      "12.2":
        title: "Output Summary Dashboard Card"
        description: "As a business owner, I want a prominent dashboard showing Total Output, Batch Cost, and Cost per kg"
        acceptance_criteria:
          - "Dedicated Material Card with metric tiles for Total Output, Batch Cost, and Cost / kg"
          - "Interactive yield scale controls embedded within the summary card"
        dependencies: ["11.3", "12.1"]
        tech_stack: [kotlin, android, compose]
        test_focus: [unit, ui]
        complexity: MEDIUM
      "12.3":
        title: "Modernize Ingredient Rows & Relocate Action Buttons"
        description: "As a cook, I want full-width ingredient rows and action buttons that don't cover prices"
        acceptance_criteria:
          - "Relocate Copy and Weigh buttons to the header actions row beside scale buttons"
          - "Ingredient list takes full card width without floating obstruction"
          - "Line-item prices are styled in dedicated primary-tinted Surface badges"
        dependencies: ["12.1"]
        tech_stack: [kotlin, android, compose]
        test_focus: [ui]
        complexity: LOW

  # Epic 14: Quick-Edit Pricing Integration
  "14":
    title: "Quick-Edit Pricing Integration"
    goal: "Enable cooks to edit master ingredient prices directly from the Recipe Viewer via row long-press and price badge taps without leaving the recipe"
    priority: HIGH
    stories:
      "14.1":
        title: "Row Long-Press Listener & Price Badge Click"
        description: "As a cook, I want to long-press an ingredient or tap its price badge in the recipe viewer to edit its master cost directly"
        acceptance_criteria:
          - "Long-pressing an ingredient row in Recipe Viewer triggers quick-edit price dialog"
          - "Clicking an ingredient price badge or unpriced indicator opens quick-edit price dialog"
          - "Informational rows are safely excluded from price editing"
        dependencies: ["12.3"]
        tech_stack: [kotlin, android, compose]
        test_focus: [ui, unit]
        complexity: LOW

      "14.2":
        title: "Master Data Retrieval"
        description: "As the costing engine, I want to resolve the exact master ingredient record to pre-populate the edit dialog"
        acceptance_criteria:
          - "Resolves existing master ingredient by linked recipe ID, direct name, or alias"
          - "Supplies recipe titles for sub-recipe linking"
          - "Falls back gracefully to pre-fill raw ingredient name and unit for unpriced items"
        dependencies: ["14.1"]
        tech_stack: [kotlin, android, room]
        test_focus: [unit]
        complexity: LOW

      "14.3":
        title: "Dialog Injection & Live Recalculation"
        description: "As a cook, I want the recipe's line cost, batch cost, and cost per kg to recalculate live immediately upon saving"
        acceptance_criteria:
          - "Reuses master cost edit dialog directly over the Recipe Viewer"
          - "Persists new price, unit, category, and sub-recipe link to Room database"
          - "Auto-registers alias when raw ingredient name differs from master name"
          - "Instantly updates recipe totals and line cost without page refresh"
        dependencies: ["14.2"]
        tech_stack: [kotlin, android, room, compose]
        test_focus: [unit, integration]
        complexity: MEDIUM

  # Epic 15: Commercial Kitchen & UX Enhancements
  "15":
    title: "Commercial Kitchen & UX Enhancements"
    goal: "Optimize production efficiency in commercial mithai operations with in-line alias mapping, interactive batch scaling presets, and distraction-free Cook Mode"
    priority: HIGH
    stories:
      "15.1":
        title: "In-Line Unpriced Item Indicator & Quick-Map Chip"
        description: "As a cook, I want to tap an [+ Add Cost / Map] chip on unpriced ingredients to instantly link aliases or enter quick unit prices without leaving the recipe"
        acceptance_criteria:
          - "Unpriced ingredient rows display prominent [+ Add Cost / Map] indicator chip"
          - "Tapping chip opens bottom dialog offering alias mapping to existing master ingredients or creating a new master price"
          - "Smart suggestion list provides 1-tap alias binding to existing master ingredients"
          - "Recipe costs recalculate immediately in the background via Room Flow upon binding"
        dependencies: ["14.1", "14.3"]
        tech_stack: [kotlin, android, compose, room]
        test_focus: [ui, unit]
        complexity: MEDIUM

      "15.2":
        title: "Interactive Batch Scaler Bottom Sheet with Common Multipliers"
        description: "As a production chef, I want an interactive batch scaler dialog with common multiplier presets (0.5x, 1x, 2x, 5x, 10x) and side-by-side cost and output comparisons"
        acceptance_criteria:
          - "Output summary dashboard provides direct trigger into Batch Scaler"
          - "Quick preset chips for 0.5x, 1x, 2x, 5x, and 10x multipliers"
          - "Interactive custom target output and multiplier input"
          - "Live side-by-side comparison of output yield and batch cost before applying"
        dependencies: ["12.2"]
        tech_stack: [kotlin, android, compose]
        test_focus: [ui, unit]
        complexity: MEDIUM

      "15.3":
        title: "Recipe Cook Mode Full-Screen Focus with Cost Masking & Step Checkoffs"
        description: "As a kitchen worker, I want a distraction-free Cook Mode with awake screen, masked financials for employee privacy, large typography, pinned operational notes, and interactive checkoffs"
        acceptance_criteria:
          - "Cook Mode toggle accessible from top AppBar action and recipe card"
          - "Keeps device screen awake while active (FLAG_KEEP_SCREEN_ON)"
          - "Masks financial line costs, total cost, and cost per kg for privacy"
          - "Pins operational and informational notes (ट्रे size, packaging) into dedicated top banner"
          - "Enlarges ingredient typography (18sp amounts, 17sp names) with 28dp strike-through checkoffs"
        dependencies: ["11.2", "12.3"]
        tech_stack: [kotlin, android, compose]
        test_focus: [ui, unit]
        complexity: MEDIUM

